# Example: Sweep across multiple quantizations of the same model
# Runs all quantizations sequentially, then prints a comparison table.
# Usage: auto-swe-bench run configs/llama3.1-8b-quant-sweep.yaml

name: llama3.1-8b-quant-sweep
dataset: SWE-bench/SWE-bench_Verified

model:
  source: huggingface
  repo_id: bartowski/Meta-Llama-3.1-8B-Instruct-GGUF
  sweep:
    - label: Q4_K_M
      filename: Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf
    - label: Q5_K_M
      filename: Meta-Llama-3.1-8B-Instruct-Q5_K_M.gguf
    - label: Q6_K
      filename: Meta-Llama-3.1-8B-Instruct-Q6_K.gguf
    - label: Q8_0
      filename: Meta-Llama-3.1-8B-Instruct-Q8_0.gguf

backend:
  type: llamacpp
  host: 127.0.0.1
  port: 8080
  llamacpp:
    ctx_size: 32768
    n_gpu_layers: auto
    parallel: 4
    flash_attn: true

sampling:
  temperature: 0.0
  top_p: 1.0
  max_tokens: 4096

agent:
  max_steps: 30
  timeout: 300
  workers: 1

evaluation:
  run_evaluation: true
  max_workers: 4
  cache_level: env
