# Smoke-test sweeping over various context sizes
# Usage: auto-swe-bench run configs/ctx-size-sweep.yaml

name: ctx-size-sweep
backend_type: llamacpp
dataset: SWE-bench/SWE-bench_Verified

instance_ids:
  - swe-bench/sympy__sympy-22914

model:
  name: Qwen3.5-2B-UD-Q5_K_XL
  source: huggingface
  repo_id: unsloth/Qwen3.5-2B-GGUF
  filename: Qwen3.5-2B-UD-Q5_K_XL.gguf
  sweep:
    - label: ctx-1k
      overrides:
        backend_options:
          ctx_size: 1024
    - label: ctx-4k
      overrides:
        backend_options:
          ctx_size: 4096
    - label: ctx-8k
      overrides:
        backend_options:
          ctx_size: 8192
    - label: ctx-16k
      overrides:
        backend_options:
          ctx_size: 16384
    - label: ctx-32k
      overrides:
        backend_options:
          ctx_size: 32768
    - label: ctx-64k
      overrides:
        backend_options:
          ctx_size: 65536
    - label: ctx-128k
      overrides:
        backend_options:
          ctx_size: 131072

sampling:
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  max_tokens: 32768

agent:
  agent: openhands
  env: docker
  attempts: 1
  limit: 1
  setup_multiplier: 10.0

evaluation:
  run_evaluation: true
