# Example: Quick smoke-test on 1 instance with a small local model
# Usage: auto-swe-bench run configs/smoke-test.yaml

name: smoke-test
dataset: SWE-bench/SWE-bench_Verified

instance_ids:
  - sympy__sympy-22914

model:
  name: Qwen3.5-4B-UD-Q5_K_XL
  source: huggingface
  repo_id: unsloth/Qwen3.5-4B-GGUF
  filename: Qwen3.5-4B-UD-Q5_K_XL.gguf

backend:
  type: llamacpp
  host: 127.0.0.1
  port: 8080
  # Use host.docker.internal on macOS/Docker Desktop
  docker_gateway: "172.17.0.1"
  llamacpp:
    ctx_size: 262144
    n_gpu_layers: auto
    parallel: 1
    extra_args: []

# Sampling settings (documented here; Harbor uses model defaults)
sampling:
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  max_tokens: 32768

agent:
  agent: openhands
  env: docker
  attempts: 1       # -k: attempts per instance
  limit: 1          # -l: max instances from dataset
  setup_multiplier: 10.0
  # agent_kwargs for openhands (version, python_version) are auto-injected

evaluation:
  run_evaluation: true
