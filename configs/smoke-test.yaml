# Example: Quick smoke-test on 1 instance with a small local model
# Usage: auto-bench run configs/smoke-test.yaml

name: smoke-test
backend_type: llamacpp
dataset: SWE-bench/SWE-bench_Verified

instance_ids:
  - swe-bench/sympy__sympy-22914

model:
  name: Qwen3.5-2B-UD-Q5_K_XL
  source: huggingface
  repo_id: unsloth/Qwen3.5-2B-GGUF
  filename: Qwen3.5-2B-UD-Q5_K_XL.gguf

sampling:
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  min_p: 0.0
  presence_penalty: 1.5
  repetition_penalty: 1.0

agent:
  agent: openhands
  env: docker
  attempts: 1
  limit: 1
  setup_multiplier: 10.0

evaluation:
  run_evaluation: true
  perplexity:
    enabled: true
