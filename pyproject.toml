[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auto-swe-bench"
version = "0.1.0"
description = "Automated SWE-bench Verified runs against locally-hosted LLMs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "huggingface-hub>=0.23",
    "rich>=13.0",
    "mini-swe-agent>=2.0",
    "swebench>=3.0",
]

[project.scripts]
auto-swe-bench = "auto_swe_bench.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["auto_swe_bench"]
