[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auto-bench"
version = "0.1.0"
description = "Automated SWE-bench Verified runs against locally-hosted LLMs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "jsonnet>=0.20",
    "httpx>=0.27",
    "huggingface-hub>=0.23",
    "rich>=13.0",
    "swebench>=3.0",
    "datasets>=2.0",
    # Harbor is invoked via `uvx harbor run` (uv must be installed separately)
    "matplotlib>=3.7",
    "vllm>=0.6",
    "zstandard>=0.22",
]

[project.scripts]
auto-bench = "auto_bench.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["auto_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
